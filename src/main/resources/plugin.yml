name: ChunkCap
version: 1.0.0
main: dev.agent.chunkcap.ChunkCapPlugin
api-version: '1.21.11'
author: Max Winkler 
description: Legt Limits pro Chunk für ausgewählte Blocktypen fest.
commands:
  chunklimit:
    description: Konfiguriert und prüft Blocklimits pro Chunk.
    usage: /chunklimit <set|remove|list|check|antilag|antilagcolor|theme|reload>
permissions:
  chunkcap.admin:
    description: Gewährt alle ChunkCap-Verwaltungsbefehle und den Platzierungs-Bypass.
    default: op
    children:
      chunkcap.set: true
      chunkcap.remove: true
      chunkcap.list: true
      chunkcap.check: true
      chunkcap.reload: true
      chunkcap.bypass: true
  chunkcap.set:
    description: Erlaubt das Festlegen und Ändern von Blocklimits pro Chunk.
    default: op
  chunkcap.remove:
    description: Erlaubt das Entfernen von Blocklimits pro Chunk.
    default: op
  chunkcap.list:
    description: Erlaubt das Auflisten konfigurierter Blocklimits.
    default: op
  chunkcap.check:
    description: Erlaubt das Prüfen der Blockanzahl im aktuellen Chunk.
    default: op
  chunkcap.reload:
    description: Erlaubt das Neuladen der ChunkCap-Konfiguration.
    default: op
  chunkcap.bypass:
    description: Umgeht Platzierungslimits pro Chunk (platzierte Blöcke werden weiterhin gezählt).
    default: false
