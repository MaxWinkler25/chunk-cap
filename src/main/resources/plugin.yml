name: ChunkCap
version: 1.0.0
main: dev.agent.chunkcap.ChunkCapPlugin
api-version: '1.21.11'
author: Max Winkler 
description: Set per-chunk limits for selected block types.
commands:
  chunklimit:
    description: Configure or inspect per-chunk block limits.
    usage: /chunklimit <set|remove|list|check|antilag|antilagcolor|theme|reload>
permissions:
  chunkcap.admin:
    description: Grants all ChunkCap administration commands and placement bypass.
    default: op
    children:
      chunkcap.set: true
      chunkcap.remove: true
      chunkcap.list: true
      chunkcap.check: true
      chunkcap.reload: true
      chunkcap.bypass: true
  chunkcap.set:
    description: Allows setting or changing per-chunk block caps.
    default: op
  chunkcap.remove:
    description: Allows removing per-chunk block caps.
    default: op
  chunkcap.list:
    description: Allows listing configured block caps.
    default: op
  chunkcap.check:
    description: Allows checking block counts in the current chunk.
    default: op
  chunkcap.reload:
    description: Allows reloading ChunkCap configuration.
    default: op
  chunkcap.bypass:
    description: Bypasses per-chunk placement limits (placed blocks still count).
    default: false
