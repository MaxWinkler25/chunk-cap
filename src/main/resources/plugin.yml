name: ChunkCap
version: 1.0.0
main: dev.agent.chunkcap.ChunkCapPlugin
api-version: '1.21.11'
author: Max Winkler 
description: Set per-chunk limits for selected block types.
commands:
  chunklimit:
    description: Configure or inspect per-chunk block limits.
    usage: /chunklimit <set|remove|list|check|reload>
    permission: chunkcap.admin
permissions:
  chunkcap.admin:
    description: Allows changing and checking chunk block limits.
    default: op
    children:
      chunkcap.bypass: true
  chunkcap.bypass:
    description: Bypasses per-chunk placement limits (placed blocks still count).
    default: false
