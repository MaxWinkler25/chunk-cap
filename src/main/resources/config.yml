# Maximale Anzahl pro Chunk, Schlüssel sind Minecraft-Blocknamen wie bei /give
# und /setblock, zum Beispiel hopper, grass_block oder diamond_block.
#
# Bukkit-Materialnamen (HOPPER) und namespaced IDs (minecraft:hopper) werden ebenfalls
# akzeptiert. Ältere Konfigurationen bleiben dadurch kompatibel. Einträge werden beim
# Ändern eines Limits in Minecraft-Schreibweise zurückgeschrieben.
#
# Mit dem Wert 0 wird das Platzieren des Blocks verhindert.
#
#   limits:
#     hopper: 16
#     spawner: 8
limits: {}

# Anti-Lag-Modus, Farbe und Animationsthema werden pro Spieler anhand der UUID in
# plugins/ChunkCap/player-settings.yml gespeichert.
