name: ChunkCap erstellen

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Quellcode auschecken
        uses: actions/checkout@v6

      - name: Java 21 einrichten
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Plugin erstellen
        run: mvn --batch-mode --no-transfer-progress clean package

      - name: Plugin-JAR hochladen
        uses: actions/upload-artifact@v6
        with:
          name: ChunkCap
          path: target/ChunkCap.jar
          if-no-files-found: error
